<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA" />
      <stop offset="50%" style="stop-color:#764BA2" />
      <stop offset="100%" style="stop-color:#F093FB" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGradient2)"/>
  
  <!-- Chart container circle -->
  <circle cx="512" cy="512" r="280" fill="white" opacity="0.95"/>
  
  <!-- Line chart -->
  <polyline points="300,600 400,500 500,550 600,400 700,450" 
            stroke="#764BA2" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chart points -->
  <circle cx="300" cy="600" r="16" fill="#764BA2"/>
  <circle cx="400" cy="500" r="16" fill="#764BA2"/>
  <circle cx="500" cy="550" r="16" fill="#764BA2"/>
  <circle cx="600" cy="400" r="16" fill="#764BA2"/>
  <circle cx="700" cy="450" r="16" fill="#764BA2"/>
  
  <!-- Decorative elements -->
  <circle cx="250" cy="250" r="20" fill="white" opacity="0.6"/>
  <circle cx="750" cy="250" r="15" fill="white" opacity="0.4"/>
  <circle cx="250" cy="750" r="12" fill="white" opacity="0.5"/>
  <circle cx="750" cy="750" r="18" fill="white" opacity="0.3"/>
</svg>
